name = "Shironet Lyrics"
description = "Fills the Lyrics tag of Hebrew songs from Shironet, through a lyrics server that caches and fetches."
long_description = """
A client of the Shironet lyrics server (in this repository's `server/` folder), which keeps
the lyrics cache and fetches from Shironet with a real browser. Set the server URL in
**Options > Plugins > Shironet Lyrics** (default `http://127.0.0.1:8735`).

- When a file without lyrics is matched to a track, the plugin asks the server: a cached
  song fills the **Lyrics** tag at once, any other Hebrew song is queued for Shironet.
- Right-click > **Plugins > Lookup lyrics in Shironet** fills missing lyrics, replaces lyrics
  that differ from the cached ones, and queues the rest. Run it again later for queued songs.
- Every loaded or saved file sends its lyrics to the server. Lyrics changed in a save
  replace the cached ones.
- **Tools > Shironet Lyrics > Scan folder for lyrics** does the same for a whole folder;
  a rescan reads only new and changed files.

The server fetches only Hebrew songs: a Hebrew letter in the artist or title, or a Hebrew
language tag. Nothing is written to your files until you save.
"""
